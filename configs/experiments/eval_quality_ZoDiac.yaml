name: "Quality_Eval_ZoDiac"
output_dir: "outputs/quality_eval/ZoDiac_results"
seed: 42
device: "cuda:0"

max_samples: 1
batch_size: 1
inference_steps: 50

model: "configs/models/sd_v1_5.yaml"
method: "configs/methods/watermarks/ZoDiac.yaml"
dataset: "configs/datasets/coco.yaml"

metrics:

  - "configs/metrics/basic_group.yaml"

  - "configs/metrics/clipscore.yaml"

  - "configs/metrics/fid.yaml"

  - "configs/metrics/dreamsim.yaml"

  - "configs/metrics/sifid.yaml"
